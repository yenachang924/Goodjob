server:
  address: ${GOODJOB_BIND_ADDRESS:127.0.0.1}
  port: ${GOODJOB_PORT:8080}
  tomcat:
    connection-timeout: 5s
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${GOODJOB_DB_URL}
    username: ${GOODJOB_DB_USERNAME}
    password: ${GOODJOB_DB_PASSWORD}
  flyway:
    enabled: true
goodjob:
  security:
    username: ${GOODJOB_USERNAME}
    password: ${GOODJOB_PASSWORD}
    allowed-origin: ${GOODJOB_ALLOWED_ORIGIN:http://127.0.0.1:8080}
    rate-limit-per-minute: ${GOODJOB_RATE_LIMIT_PER_MINUTE:120}
  http:
    max-body-bytes: ${GOODJOB_MAX_BODY_BYTES:16384}
